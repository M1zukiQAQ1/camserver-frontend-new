# Temporary HTTP configuration used while obtaining the first TLS certificate.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name armageddon.deepspace.ucsb.edu;
    client_max_body_size 110m;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / {
        include /etc/nginx/snippets/allsky-proxy.conf;
        proxy_pass http://127.0.0.1:3000;
    }
}
