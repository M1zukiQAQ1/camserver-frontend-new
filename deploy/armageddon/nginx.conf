server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name armageddon.deepspace.ucsb.edu;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    client_max_body_size 110m;

    # Nuxt serves icon JSON; the camera backend does not own this API route.
    location ^~ /api/_nuxt_icon/ {
        include /etc/nginx/snippets/allsky-proxy.conf;
        proxy_pass http://127.0.0.1:3000;
    }
    # Compatibility for links generated by older frontend builds.
    location /api/backend/ {
        include /etc/nginx/snippets/allsky-proxy.conf;
        proxy_pass http://127.0.0.1:8080/;
    }
    # Present a consistent API prefix for Spring's legacy settings endpoint.
    location = /api/settings {
        include /etc/nginx/snippets/allsky-proxy.conf;
        proxy_pass http://127.0.0.1:8080/settings;
    }
    location /api/ {
        include /etc/nginx/snippets/allsky-proxy.conf;
        proxy_pass http://127.0.0.1:8080;
    }
    location ~ ^/(settings|stats|live_pos|upload_live)$ {
        include /etc/nginx/snippets/allsky-proxy.conf;
        proxy_pass http://127.0.0.1:8080;
    }

    location = /allSky { return 308 /gallery; }
    location = /seeingMonitor { return 308 /seeing-monitor; }
    location = /live { return 308 /seeing-monitor; }
    location = /live_login { return 308 /seeing-monitor; }
    location = /starTracker { return 410; }

    location / {
        include /etc/nginx/snippets/allsky-proxy.conf;
        proxy_pass http://127.0.0.1:3000;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name armageddon.deepspace.ucsb.edu;
    ssl_certificate /etc/ssl/allskycam/fullchain.pem;
    ssl_certificate_key /etc/ssl/allskycam/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Preserve request methods and bodies, without caching a scheme preference.
    add_header Cache-Control "no-store" always;
    return 307 http://armageddon.deepspace.ucsb.edu$request_uri;
}
