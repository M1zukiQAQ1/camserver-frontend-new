server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name armageddon.deepspace.ucsb.edu;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / {
        return 308 https://armageddon.deepspace.ucsb.edu$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name armageddon.deepspace.ucsb.edu;
    ssl_certificate /etc/letsencrypt/live/armageddon.deepspace.ucsb.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/armageddon.deepspace.ucsb.edu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 110m;

    # Keep both public camera URLs and the Nuxt proxy URLs compatible.
    location /api/backend/ {
        include /etc/nginx/snippets/allsky-proxy.conf;
        proxy_pass http://127.0.0.1:8080/;
    }
    location /api/ {
        include /etc/nginx/snippets/allsky-proxy.conf;
        proxy_pass http://127.0.0.1:8080;
    }
    location ~ ^/(settings|stats|live_pos|upload_live)$ {
        include /etc/nginx/snippets/allsky-proxy.conf;
        proxy_pass http://127.0.0.1:8080;
    }

    location = /allSky { return 308 /gallery; }
    location = /seeingMonitor { return 308 /seeing-monitor; }
    location = /live { return 308 /seeing-monitor; }
    location = /live_login { return 308 /seeing-monitor; }
    location = /starTracker { return 410; }

    location / {
        include /etc/nginx/snippets/allsky-proxy.conf;
        proxy_pass http://127.0.0.1:3000;
    }
}
